# Налаштування java.util.logging для Task 10 (читає клас ua.kpi.java.task10.logging.LoggingConfig).
#
# Повідомлення фільтруються двічі:
#   1) рівнем реєстратора (Logger) - записи нижчі за FINE (FINER, FINEST) відкидаються одразу;
#   2) рівнем кожного обробника (Handler) - на консоль ідуть лише WARNING і SEVERE,
#      у файл - від INFO і вище; записи CONFIG і FINE не потрапляють нікуди.

# Кореневий реєстратор: без обробників, рівень за замовчуванням для чужих реєстраторів (JDK).
handlers =
.level = INFO

# Реєстратори програми (ua.kpi.java.task10 і всі вкладені пакети) мають власні обробники.
ua.kpi.java.task10.level = FINE
ua.kpi.java.task10.handlers = java.util.logging.ConsoleHandler, java.util.logging.FileHandler
ua.kpi.java.task10.useParentHandlers = false

# Консоль (System.err): лише попередження і помилки.
java.util.logging.ConsoleHandler.level = WARNING
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter
java.util.logging.ConsoleHandler.encoding = UTF-8

# Текстовий файл: хід виконання програми (INFO) і помилки. Шлях відносно робочої папки,
# записи дописуються в кінець файлу між запусками.
java.util.logging.FileHandler.pattern = logs/books.log
java.util.logging.FileHandler.append = true
java.util.logging.FileHandler.level = INFO
java.util.logging.FileHandler.formatter = java.util.logging.SimpleFormatter
java.util.logging.FileHandler.encoding = UTF-8

# Формат запису: дата час рівень реєстратор - повідомлення [виняток]
java.util.logging.SimpleFormatter.format = %1$tF %1$tT %4$-7s %3$s - %5$s%6$s%n
